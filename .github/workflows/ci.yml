name: CI

on:
  push:
    branches: [main]
  # No base-branch filter on purpose. A stacked pull request targets the branch
  # below it rather than `main`, so a `branches: [main]` filter here skips CI on
  # every PR in a stack except the last one — and skips it silently: no checks
  # appear at all, so neither reviewer nor author can tell "passed" from "never
  # ran". A pull request only exists against branches someone opened it for.
  pull_request:
  # Manual trigger, for when the run that should have fired never did.
  #
  # GitHub throttles webhook delivery during Actions incidents, and an `opened`
  # or `synchronize` event dropped that way leaves a pull request with no checks
  # at all and no way to ask for any. Closing and reopening the PR re-fires
  # `reopened` and is the usual workaround, until the throttling reaches that
  # event too — which is exactly what happened on #20 and #22.
  #
  # `workflow_dispatch` is only readable from the default branch, so adding it
  # inside a pull request does nothing for that pull request. It has to be on
  # main before it can rescue anything, which is why this is its own change.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to check out and run against"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on push/pull_request, which is checkout's default behaviour.
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src

      - name: Format check
        run: ruff format --check src

      - name: Type check
        run: mypy src

      - name: Run tests
        run: pytest

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Verify distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Smoke-install built wheel and import
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet --upgrade pip
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/smoke-venv/bin/python -c "import ort_vision_sdk as m; \
            assert m.__version__, 'no __version__'; \
            assert m.Detector and m.Classifier and m.Segmenter, 'tasks missing'; \
            assert m.Boxes and m.Probs and m.Masks, 'result envelopes missing'; \
            print('Smoke OK · version =', m.__version__)"

  web:
    name: Web (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-js-web
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on push/pull_request, which is checkout's default behaviour.
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-js-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (dry-run sanity)
        run: npm pack --dry-run

      - name: Smoke-install packed tarball and import in a fresh project
        run: |
          TARBALL=$(npm pack --silent)
          PKG_NAME=$(node -p "require('./package.json').name")
          mkdir -p /tmp/web-smoke && cd /tmp/web-smoke
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --silent "$GITHUB_WORKSPACE/sdk-js-web/$TARBALL" onnxruntime-web@^1.17
          PKG_NAME="$PKG_NAME" node -e "import(process.env.PKG_NAME).then(m => { \
            if (!m.Detector || !m.Segmenter || !m.Classifier) throw new Error('tasks missing'); \
            if (!m.Boxes || !m.Probs || !m.Masks) throw new Error('result envelopes missing'); \
            if (!m.VERSION) throw new Error('no VERSION'); \
            console.log('Smoke OK · VERSION =', m.VERSION); \
          })"
