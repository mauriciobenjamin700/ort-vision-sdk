[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ort-vision-sdk"
version = "0.7.0"
description = "High-level Python SDK for computer vision inference with ONNX Runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mauricio Benjamin", email = "mauriciobenjamin700@gmail.com" },
]
keywords = ["onnx", "onnxruntime", "computer-vision", "inference", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17.0"]
opencv = ["opencv-python>=4.8.0"]
# Build-time only: `ort_vision_sdk.compose` rewrites ONNX protobufs to fuse two
# models into one graph. Running the fused model needs nothing beyond the
# onnxruntime already in the base dependencies, so `onnx` stays out of the
# runtime install.
compose = ["onnx>=1.16.0"]
dev = [
    "onnx>=1.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/mauriciobenjamin700/ort-vision-sdk"
Repository = "https://github.com/mauriciobenjamin700/ort-vision-sdk"
Issues = "https://github.com/mauriciobenjamin700/ort-vision-sdk/issues"
Changelog = "https://github.com/mauriciobenjamin700/ort-vision-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ort_vision_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ort_vision_sdk",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = [
    "/dist",
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "RUF",
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Versão que o mypy assume ao *parsear* — não o piso suportado pelo pacote, que
# segue em `requires-python = ">=3.11"`. numpy >= 2.4 escreve seus stubs com
# `type` statements (PEP 695, 3.12+), e com 3.11 aqui o mypy recusa parsear
# `numpy/__init__.pyi` e aborta antes de checar o nosso código. Baixar numpy ou
# pular seus stubs sai pior (o segundo degrada `ndarray` para `Any` e invalida
# nossos aliases). A compatibilidade com 3.11 fica coberta pelo ruff
# (`target-version = "py311"`) e pela matriz 3.11/3.12/3.13 do CI, que roda os
# testes de verdade em cada versão.
python_version = "3.12"
strict = true
# numpy 2.x marca `ndarray` como genérico; defaults via PEP 696 só funcionam em
# Python 3.13+, então em 3.11/3.12 mypy strict pediria type args em todo
# uso de np.ndarray. Desligamos a checagem global para evitar 40+ pontos de fricção.
disallow_any_generics = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "default::DeprecationWarning:ort_vision_sdk.*",
]
